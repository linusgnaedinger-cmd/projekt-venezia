<html lang="de">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Projekt Venezia · Linus Gnädinger</title>
<meta name="description" content="M&A-Case-Study: KKR erwirbt 25 % an Enilive. DCF, WACC, Trading Comps, Precedent Transactions und Returns-Analyse von Linus Gnädinger.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: blaues Kopfband wie ein Pitchbook-Deckblatt, darunter ruhige Seiten auf Weiß/Grau, max. 1120px */
:root {
  --db-blue: #0018A8;     /* Deutsche-Bank-Blau */
  --band: #0018A8;        /* Kopfband */
  --band-fg: #FFFFFF;
  --bg: #FFFFFF;
  --surface: #F3F5F9;     /* Grau mit leichtem Blaustich */
  --line: #D8DEE8;
  --fg: #0B1433;
  --muted: #5A6479;
  --accent: #0018A8;
  --accent-soft: #E6EAFA;
  --todo-bg: #FFF1B8;
  --todo-fg: #5C4700;
  --ok: #1E7A4C; --warn: #A76200; --crit: #B3261E;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", Arial, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --band: #0A1A8A; --band-fg: #FFFFFF;
    --bg: #090E1C; --surface: #111933; --line: #253055;
    --fg: #E8ECF6; --muted: #9AA4BD; --accent: #8EA0FF; --accent-soft: #1A2550;
    --todo-bg: #4A3D08; --todo-fg: #FFE58A;
    --ok: #5CC98F; --warn: #F0B04A; --crit: #FF8A80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --band: #0A1A8A; --band-fg: #FFFFFF;
  --bg: #090E1C; --surface: #111933; --line: #253055;
  --fg: #E8ECF6; --muted: #9AA4BD; --accent: #8EA0FF; --accent-soft: #1A2550;
  --todo-bg: #4A3D08; --todo-fg: #FFE58A;
  --ok: #5CC98F; --warn: #F0B04A; --crit: #FF8A80;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 var(--font-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band); }
a { color: var(--accent); }
a:focus-visible, .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.2; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Kopfzeile */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--band); color: var(--band-fg); }
.top-in { display: flex; align-items: center; gap: 24px; min-height: 56px; flex-wrap: wrap; padding-block: 8px; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--band-fg); text-decoration: none; font-family: var(--font-display); font-weight: 600; font-size: 18px; letter-spacing: .02em; }
#nav { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 14px; }
#nav a { color: var(--band-fg); opacity: .78; text-decoration: none; padding-block: 4px; border-bottom: 2px solid transparent; }
#nav a:hover { opacity: 1; }
#nav a[aria-current="page"] { opacity: 1; border-bottom-color: var(--band-fg); }

/* Landing */
.hero { background: var(--band); color: var(--band-fg); }
.hero-in { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 48px; align-items: center; padding-block: 56px 64px; }
.hero h1 { font-size: clamp(34px, 5vw, 56px); font-weight: 600; letter-spacing: -.01em; margin-block: 10px 16px; }
.hero .lead { font-size: 19px; max-width: 34em; margin: 0 0 12px; opacity: .92; }
.hero .byline { font-size: 14px; opacity: .75; margin: 0 0 28px; }
.eyebrow { text-transform: uppercase; letter-spacing: .12em; font-size: 12px; font-weight: 600; margin: 0; }
.hero .eyebrow { opacity: .8; }
.btn { display: inline-block; background: var(--band-fg); color: var(--db-blue); font-weight: 600; text-decoration: none; padding: 12px 22px; }
.btn:hover { background: var(--accent-soft); }
.btns { display: flex; flex-wrap: wrap; gap: 12px; }
.btn-ghost { background: transparent; color: var(--band-fg); box-shadow: inset 0 0 0 1.5px var(--band-fg); }
.btn-ghost:hover { background: rgba(255,255,255,.12); }
.panel.dl { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; margin-top: 24px; }
.panel.dl h3 { margin-top: 0; }
.btn-dl { display: inline-block; background: var(--db-blue); color: #fff; font-weight: 600; text-decoration: none; padding: 12px 22px; white-space: nowrap; }
.btn-dl:hover { opacity: .9; }
.tombstone { background: #FFFFFF; color: #0B1433; padding: 28px 24px; text-align: center; border-top: 6px solid #0018A8; box-shadow: 0 18px 40px rgba(0, 0, 0, .25); }
.tombstone p { margin: 0; }
.ts-k { font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: #5A6479; margin-bottom: 18px !important; }
.ts-buyer, .ts-target { font-family: var(--font-display); font-size: 26px; font-weight: 600; color: #0018A8; }
.ts-mid { font-size: 13px; color: #5A6479; margin-block: 4px !important; }
.ts-val { font-family: var(--font-num); font-size: 22px; margin-block: 18px !important; padding-block: 12px; border-block: 1px solid #D8DEE8; }
.ts-role { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: #5A6479; }
.ts-adv { font-weight: 600; margin-top: 2px !important; }
.ts-date { font-size: 13px; color: #5A6479; margin-top: 10px !important; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); margin-block: 40px; }
.kpi { background: var(--bg); padding: 20px; display: flex; flex-direction: column; gap: 4px; }
.kpi-v { font-family: var(--font-num); font-size: 24px; font-weight: 500; color: var(--accent); font-variant-numeric: tabular-nums; }
.kpi-l { font-size: 13px; color: var(--muted); }
.kpis-in { margin-block: 16px 8px; }

.h-sec { font-size: 26px; margin-bottom: 16px; }
.sec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; margin-bottom: 64px; }
.sec-card { position: relative; display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; padding: 20px 44px 20px 20px; background: var(--surface); text-decoration: none; color: var(--fg); border-left: 3px solid transparent; transition: border-color .15s, background .15s; }
.sec-card:hover, .sec-card:focus-visible { border-left-color: var(--accent); background: var(--accent-soft); }
.sec-nr { grid-row: span 2; font-family: var(--font-num); font-size: 22px; color: var(--accent); line-height: 1.2; }
.sec-t { font-family: var(--font-display); font-weight: 600; font-size: 19px; }
.sec-k { font-size: 14px; color: var(--muted); }
.sec-go { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); color: var(--accent); font-size: 20px; }

/* Unterseiten */
.page { padding-block: 32px 64px; }
.crumb { font-size: 13px; color: var(--muted); margin: 0 0 6px; }
.h-page { font-size: clamp(30px, 4vw, 44px); font-weight: 600; color: var(--accent); margin-bottom: 24px; padding-bottom: 14px; border-bottom: 2px solid var(--accent); }
.h-sub { font-size: 21px; margin-block: 36px 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.h-co { font-size: 28px; margin-block: 4px 10px; color: var(--accent); }
.panel h3 { font-size: 18px; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.panel h4 { font-size: 17px; margin-bottom: 6px; }
.panel p { margin: 0; }
.prose { max-width: 68ch; margin: 0 0 24px; }
.prose.big { font-size: 20px; line-height: 1.5; }
.panel { background: var(--surface); padding: 20px; min-width: 0; }
.panel .prose { margin-bottom: 16px; }
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 16px; }
.stack { display: grid; gap: 16px; min-width: 0; align-content: start; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.min0 { min-width: 0; }

.facts { margin: 0; display: grid; }
.facts div { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 12px; padding-block: 8px; border-bottom: 1px solid var(--line); }
.facts div:last-child { border-bottom: 0; }
.facts dt { color: var(--muted); font-size: 14px; }
.facts dd { margin: 0; font-weight: 500; }

.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 2px solid var(--accent); }
td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.num td:not(:first-child), table.num th:not(:first-child) { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.sum td { font-weight: 600; border-top: 2px solid var(--fg); border-bottom: 0; }
.sens td.base { background: var(--accent); color: var(--bg); font-weight: 600; }

.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.timeline li { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 12px; padding: 8px 0 8px 16px; border-left: 2px solid var(--accent); position: relative; }
.timeline li::before { content: ""; position: absolute; left: -6px; top: 15px; width: 10px; height: 10px; background: var(--accent); }
.tl-d { font-family: var(--font-num); font-size: 13px; color: var(--accent); padding-top: 2px; }

.quotes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 32px; }
blockquote { margin: 0; padding: 4px 0 4px 20px; border-left: 3px solid var(--accent); }
blockquote p { font-family: var(--font-display); font-size: 19px; margin: 0 0 8px; }
cite { font-style: normal; font-size: 14px; color: var(--muted); }

.list { padding-left: 20px; max-width: 72ch; display: grid; gap: 8px; margin-block: 16px 24px; }
.note { font-size: 14px; color: var(--muted); margin-top: 12px !important; }
.quelle { font-size: 13px; color: var(--muted); margin-top: 32px; padding-top: 10px; border-top: 1px solid var(--line); }

mark.todo { background: var(--todo-bg); color: var(--todo-fg); padding: 1px 6px; border-radius: 2px; font-weight: 500; }
mark.todo::before { content: "Platzhalter: "; font-weight: 700; font-size: .85em; }
.badge { font-family: var(--font-body); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; background: var(--todo-bg); color: var(--todo-fg); padding: 3px 8px; font-weight: 700; }

.risk-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 6px; }
.risk-h h4 { margin: 0; }
.pill { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; padding: 2px 10px; border: 1.5px solid currentColor; }
.pill.niedrig { color: var(--ok); } .pill.mittel { color: var(--warn); } .pill.hoch { color: var(--crit); }

.own { display: flex; height: 52px; font-weight: 600; }
.own-seg { display: flex; align-items: center; padding-inline: 14px; min-width: 0; white-space: nowrap; overflow: hidden; }
.own-seg.s0 { background: var(--muted); color: var(--bg); }
.own-seg.s1 { background: var(--accent); color: var(--bg); }

.ff { width: 100%; min-width: 560px; height: auto; display: block; }
.ff-grid { stroke: var(--line); stroke-width: 1; }
.ff-tick, .ff-val { fill: var(--muted); font: 12px var(--font-num); }
.ff-lab { fill: var(--fg); font: 600 13px var(--font-body); }
.ff-bar { fill: var(--accent); fill-opacity: .85; }
.ff-bar.ex { fill: var(--accent); fill-opacity: .25; stroke: var(--accent); stroke-dasharray: 4 3; }
.ff-deal { stroke: var(--accent); stroke-width: 2.5; }
.ff-dl { fill: var(--accent); font: 700 12px var(--font-num); }

.pager { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-top: 48px; padding-top: 20px; border-top: 2px solid var(--accent); }
.pager a { font-weight: 600; text-decoration: none; }
.pager a:hover { text-decoration: underline; }

footer { background: var(--surface); color: var(--muted); font-size: 13px; }
footer .wrap { padding-block: 24px; }

@media (max-width: 820px) {
  .hero-in, .cols, .grid-2, .quotes { grid-template-columns: minmax(0, 1fr); }
  .hero-in { gap: 32px; padding-block: 40px 48px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }


/* Sprachumschalter */
.lang { margin-left: auto; display: flex; gap: 2px; }
.lang button { font: 600 12px var(--font-num); letter-spacing: .06em; color: var(--band-fg); background: transparent; border: 1.5px solid rgba(255,255,255,.55); padding: 4px 9px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--band-fg); color: var(--band); border-color: var(--band-fg); }
.lang button:focus-visible { outline: 3px solid var(--band-fg); outline-offset: 2px; }

/* Tabellen mit Kopfzeile */
th.r, td.r { text-align: right; }
td.n { font-family: var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.em td { font-weight: 600; }
table.grid td:first-child { min-width: 150px; }
.stamp { display: inline-block; font: 600 11px var(--font-body); text-transform: uppercase; letter-spacing: .06em; padding: 2px 8px; white-space: nowrap; border: 1.5px solid currentColor; }
.stamp.ante { color: var(--ok); }
.stamp.post { color: var(--warn); }
.lookback { border-left: 3px solid var(--warn); margin-block: 24px 16px; }
.lookback h3 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.list.small { font-size: 14px; margin-top: 12px; }
.note.top0 { margin-top: 0 !important; margin-bottom: 12px; }
.cols.mt { margin-top: 32px; }
@media (max-width: 820px) { .lang { margin-left: 0; } }
</style>
</head>

</header>

  fazit: {
    kernaussage:
      "My verdict from the perspective of the signing in October 2024: the price was fair, but not a bargain. At 9.4x EV/EBITDA 2025E, KKR paid a moderate premium for a growing energy transition business. Whether the deal pays off depends above all on whether Enilive delivers the planned expansion of its biorefineries by 2030.",
    punkte: [
      "Multiples: the median of the listed peers is 9.2x (market data as of 31 Dec 2024, i.e. a proxy). The small premium can be justified by higher growth and the rare combination of biorefineries and more than 5,000 service stations. Comparable transactions (7.9x to 10.2x, middle half), on the other hand, point to a price at the upper end.",
      "DCF: my model gives an equity value of €14.2bn, around 21% above the price. However, 76% of the value lies in the terminal value, half a percentage point more or less WACC changes the value by €1.2–1.4bn, and without the net cash assumption it would be €0.5bn lower. I therefore see the DCF as an upper bound rather than proof of a cheap purchase.",
      "Returns for KKR: in the base case KKR earns a 12.0% IRR and 1.9 times its invested capital, in the downside only 5.4%. That suits an infrastructure fund looking for predictable cash flows, but leaves little buffer if growth falls short.",
      "Climate transition: Enilive mainly processes waste and residues such as used cooking oil into renewable diesel (HVO) and sustainable aviation fuel (SAF). For trucks, ships and aircraft there are hardly any alternatives in the foreseeable future, and the EU's ReFuelEU regulation sets rising SAF quotas (2% from 2025, 6% from 2030). The deal channels private capital precisely into this gap.",
      "A critical view: biofuels are only as sustainable as their feedstocks, and suitable residues are scarce. A large part of the business also remains service stations selling fossil fuels. Since demand depends heavily on political quotas, a change in regulation can shift margins quickly.",
      "For Eni: the Eni group receives around €3.6bn in total, keeps control and funds the expansion without burdening its own balance sheet. The deal shows how an oil company can raise capital for the transition through its satellite model.",
      "Weighing it up: financially, the price lies within the range of my methods and towards its upper end. Strategically and for society, the deal makes sense because it funds growth in an area that climate targets depend on. As KKR's advisor, I would have recommended the deal, but pushed for protective rights in case the expansion plan is missed."
    ],
    rueckblick: "Not part of my verdict: 2025 EBITDA came in at around €1.0bn, below the plan of €1.2bn. With today's knowledge, KKR therefore paid 11.25x. Nobody knew this figure at signing. The fact that KKR increased its stake to 30% at the same valuation as early as February 2025 shows, however, that the fund is betting on the long-term development rather than a single year.",
    learnings: "I learned that a purchase price only becomes tangible through several methods: the DCF shows the intrinsic value, multiples show the market, and the two can differ significantly. I was surprised by how much details change the result, such as the €500m capital increase that separates enterprise value from equity value, half a percentage point of WACC, or a joint venture like Darling's that distorts a multiple if it is not adjusted for. The hard part was that hardly any data is public for an unlisted company. I therefore partly used later data as a proxy and clearly labelled it as ex post. This is exactly where I reach my limits as an outsider, and it is why I want to take part in the Deutsche Bank Spring Week in Frankfurt: I want to see how a deal team tests such assumptions with real data, how valuation, financing and client advice fit together, and where my reconstruction differs from practice. In the long term, I see myself as an analyst in investment banking. With access to a data room, consensus estimates and management, I would above all test the assumptions on capacity expansion and biorefinery margins in more depth and extend the returns analysis to include debt financing."
  }

  };

  /* ---------- Helfer ---------- */
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function t(s) { return esc(s == null ? "" : s); }
  function num(x, d) { return x.toLocaleString(L.locale, { minimumFractionDigits: d, maximumFractionDigits: d }); }
  function mrd(x, d) { return (x < 0 ? "–" : "") + "€" + num(Math.abs(x), d == null ? 2 : d) + L.bn; }
  function pct(x, d) { return num(x * 100, d == null ? 1 : d) + L.pctSp; }
  function modellLink(cls, text) {
    return window.MODELL_XLSX ? '<a class="' + cls + '" href="' + window.MODELL_XLSX + '" download="Projekt_Venezia_Modell.xlsx">' + text + "</a>" : "";
  }
  function quelle(q) { return q ? '<p class="quelle">' + L.source + ": " + t(q) + "</p>" : ""; }
  function facts(rows) {
    return '<dl class="facts">' + rows.map(function (r) {
      return "<div><dt>" + t(r[0]) + "</dt><dd>" + t(r[1]) + "</dd></div>";
    }).join("") + "</dl>";
  }
  // Tabelle mit Kopfzeile; cls "num" setzt Zahlen rechtsbündig, numCols = Spalten mit Zahlen
  function grid(head, rows, opts) {
    opts = opts || {};
    return '<div class="tbl-wrap"><table class="grid' + (opts.cls ? " " + opts.cls : "") + '"><thead><tr>' +
      head.map(function (h, i) { return '<th class="' + ((opts.numCols || []).indexOf(i) >= 0 ? "r" : "") + '">' + t(h) + "</th>"; }).join("") +
      "</tr></thead><tbody>" + rows.map(function (r, ri) {
        var cls = (opts.boldRows || []).indexOf(ri) >= 0 ? ' class="em"' : "";
        return "<tr" + cls + ">" + r.map(function (c, i) {
          var isNum = (opts.numCols || []).indexOf(i) >= 0;
          var html = opts.render && opts.render(c, i) || t(c);
          return '<td class="' + (isNum ? "r n" : "") + '">' + html + "</td>";
        }).join("") + "</tr>";
      }).join("") + "</tbody></table></div>";
  }
  function stamp(s) {
    var post = /post/.test(s);
    return '<span class="stamp ' + (post ? "post" : "ante") + '">' + t(s) + "</span>";
  }

  /* ---------- Berechnungen ---------- */
  function dcfValue(wacc, g) {
    var c = D.bewertung.dcf, pv = 0;
    c.fcf.forEach(function (f, i) { pv += f / Math.pow(1 + wacc, i + 1); });
    var last = c.fcf[c.fcf.length - 1];
    var tv = last * (1 + g) / (wacc - g);
    var pvTv = tv / Math.pow(1 + wacc, c.fcf.length);
    return { pvFcf: pv, tv: tv, pvTv: pvTv, ev: pv + pvTv, equity: pv + pvTv - D.bewertung.nettoverschuldung };
  }
  function quartile(a) {
    var s = a.slice().sort(function (x, y) { return x - y; });
    function p(q) { var i = (s.length - 1) * q, lo = Math.floor(i); return s[lo] + (s[Math.min(lo + 1, s.length - 1)] - s[lo]) * (i - lo); }
    return [p(0.25), p(0.75)];
  }

  /* ---------- Abschnitte ---------- */
  var RENDER = {
    ueberblick: rUeberblick, unternehmen: rUnternehmen, rationale: rRationale, bewertung: rBewertung,
    struktur: rStruktur, risiken: rRisiken, fazit: rFazit
  };
  function sections() {
    return L.sections.map(function (s) { return { id: s[0], titel: s[1], kurz: s[2], render: RENDER[s[0]] }; });
  }

  function rLanding() {
    var m = D.meta, SEC = sections();
    var kz = D.kennzahlen.map(function (k) {
      return '<div class="kpi"><span class="kpi-v">' + t(k.wert) + '</span><span class="kpi-l">' + t(k.label) + "</span></div>";
    }).join("");
    var cards = SEC.map(function (s, i) {
      return '<a class="sec-card" href="#' + s.id + '"><span class="sec-nr">' + (i + 1) + '</span><span class="sec-t">' + esc(s.titel) +
        '</span><span class="sec-k">' + esc(s.kurz) + '</span><span class="sec-go" aria-hidden="true">→</span></a>';
    }).join("");
    var adv = D.ueberblick.berater, ts = D.tombstone;
    return '<section class="hero"><div class="wrap hero-in">' +
      '<div class="hero-copy"><p class="eyebrow">' + t(m.projektname) + "</p>" +
      "<h1>" + t(m.titel) + "</h1><p class=\"lead\">" + t(m.untertitel) + "</p>" +
      '<p class="byline">' + L.createdBy + " " + t(m.autor) + " " + L.forThe + " " + t(m.anlass) + " · " + L.asOf + " " + t(m.stand) + "</p>" +
      '<div class="btns"><a class="btn" href="#ueberblick">' + L.start + "</a>" + modellLink("btn btn-ghost", L.dlShort) + "</div></div>" +
      '<aside class="tombstone" aria-label="Tombstone"><p class="ts-k">' + t(ts.sektor) + "</p>" +
      '<p class="ts-buyer">' + t(ts.kaeufer) + '</p><p class="ts-mid">' + t(ts.zeile1) + '</p><p class="ts-target">' + t(ts.ziel) + "</p>" +
      '<p class="ts-mid">' + t(ts.zeile2) + '</p><p class="ts-val">' + t(ts.wert) + "</p>" +
      '<p class="ts-role">' + t(ts.rolle) + '</p><p class="ts-adv">' + t(adv[0].finanz) + '</p><p class="ts-date">' + t(ts.datum) + "</p></aside>" +
      "</div></section>" +
      '<section class="wrap"><div class="kpis">' + kz + "</div></section>" +
      '<section class="wrap"><h2 class="h-sec">' + L.contents + '</h2><div class="sec-grid">' + cards + "</div></section>";
  }

  function rUeberblick() {
    var u = D.ueberblick;
    var adv = grid([L.side, L.finAdv, L.legAdv], u.berater.map(function (b) { return [b.seite, b.finanz, b.recht]; }));
    var tl = '<ol class="timeline">' + u.zeitplan.map(function (z) {
      return '<li><span class="tl-d">' + t(z.datum) + '</span><span class="tl-e">' + t(z.ereignis) + "</span></li>";
    }).join("") + "</ol>";
    return '<p class="prose">' + t(u.zusammenfassung) + "</p>" +
      '<div class="cols"><div class="panel"><h3>' + L.keyFacts + "</h3>" + facts(u.eckdaten) + "</div>" +
      '<div class="stack"><div class="panel min0"><h3>' + L.advisors + "</h3>" + adv + '</div><div class="panel"><h3>' + L.timeline + "</h3>" + tl + "</div></div></div>" +
      quelle(u.quelle);
  }

  function rUnternehmen() {
    return '<div class="cols">' + D.unternehmen.map(function (u) {
      return '<div class="panel"><p class="eyebrow">' + t(u.rolle) + "</p><h3 class=\"h-co\">" + t(u.name) + '</h3><p class="prose">' + t(u.beschreibung) + "</p>" + facts(u.fakten) + "</div>";
    }).join("") + "</div>" + quelle(D.unternehmenQuelle);
  }

  function rRationale() {
    var r = D.rationale;
    return '<h3 class="h-sub">' + L.reasons + '</h3><div class="grid-2">' + r.gruende.map(function (g) {
      return '<div class="panel"><h4>' + t(g.titel) + "</h4><p>" + t(g.text) + "</p></div>";
    }).join("") + '</div><h3 class="h-sub">' + L.synergies + "</h3>" +
      grid([L.area, L.lever], r.synergien.map(function (s) { return [s.bereich, s.text]; })) +
      '<div class="quotes">' + r.zitate.map(function (z) {
        return "<blockquote><p>“" + t(z.text) + "”</p><cite>" + t(z.von) + "</cite></blockquote>";
      }).join("") + "</div>" + quelle(r.quelle);
  }

  function rBewertung() {
    var b = D.bewertung, c = b.dcf;
    var base = dcfValue(c.wacc, c.wachstum);

    // Informationsstand
    var info = '<div class="panel"><p class="note top0">' + t(b.informationsstand.text) + "</p>" +
      grid([L.block, L.basis, L.status], b.informationsstand.zeilen, { render: function (v, i) { return i === 2 ? stamp(v) : null; } }) + "</div>";

    // Implizite Multiples und Brücke
    var ev = b.dealEquityValue + b.nettoverschuldung;
    var impl = '<div class="kpis kpis-in">' +
      '<div class="kpi"><span class="kpi-v">' + mrd(ev) + '</span><span class="kpi-l">' + L.evDeal + "</span></div>" +
      '<div class="kpi"><span class="kpi-v">' + num(ev / b.ebitda2024, 1) + 'x</span><span class="kpi-l">EV / EBITDA 2024</span></div>' +
      '<div class="kpi"><span class="kpi-v">' + num(ev / b.ebitda2025, 1) + 'x</span><span class="kpi-l">EV / EBITDA 2025E</span></div>' +
      '<div class="kpi"><span class="kpi-v">' + mrd(base.equity) + '</span><span class="kpi-l">' + L.eqDcf + "</span></div></div>";
    var bridge = '<div class="panel">' + grid([L.item, L.eurBn, L.evidence], b.bruecke.zeilen, { numCols: [1], boldRows: [0, b.bruecke.zeilen.length - 1] }) +
      '<p class="note">' + t(b.bruecke.kommentar) + "</p></div>";

    // DCF-Tabelle
    var head = "<th>" + L.eurBn + "</th>" + c.jahre.map(function (j) { return "<th>" + j + "E</th>"; }).join("");
    var rowF = "<td>" + L.fcf + "</td>" + c.fcf.map(function (f) { return "<td>" + num(f, 2) + "</td>"; }).join("");
    var rowD = "<td>" + L.df + "</td>" + c.fcf.map(function (f, i) { return "<td>" + num(1 / Math.pow(1 + c.wacc, i + 1), 3) + "</td>"; }).join("");
    var rowP = "<td>" + L.pv + "</td>" + c.fcf.map(function (f, i) { return "<td>" + num(f / Math.pow(1 + c.wacc, i + 1), 2) + "</td>"; }).join("");
    var dcfT = '<div class="tbl-wrap"><table class="num"><thead><tr>' + head + "</tr></thead><tbody><tr>" + rowF + "</tr><tr>" + rowD + "</tr><tr>" + rowP + "</tr></tbody></table></div>";
    var dcfBridge = facts([
      [L.sumPv, mrd(base.pvFcf)],
      [L.tv, mrd(base.tv)],
      [L.pvTv, mrd(base.pvTv)],
      ["Enterprise Value", mrd(base.ev)],
      [L.netDebt, mrd(b.nettoverschuldung)],
      ["Equity Value", mrd(base.equity)],
      [L.assumptions, "WACC " + pct(c.wacc, 2) + ", " + L.perpetual + " " + pct(c.wachstum)]
    ]);

    // Sensitivität
    var waccs = [-0.01, -0.005, 0, 0.005, 0.01].map(function (d) { return c.wacc + d; });
    var gs = [-0.005, 0, 0.005].map(function (d) { return c.wachstum + d; });
    var all = [];
    var sens = '<div class="tbl-wrap"><table class="num sens"><thead><tr><th>WACC ↓ / g →</th>' + gs.map(function (g) { return "<th>" + pct(g) + "</th>"; }).join("") + "</tr></thead><tbody>" +
      waccs.map(function (w) {
        return "<tr><td>" + pct(w, 2) + "</td>" + gs.map(function (g) {
          var v = dcfValue(w, g).equity; all.push(v);
          var isBase = Math.abs(w - c.wacc) < 1e-9 && Math.abs(g - c.wachstum) < 1e-9;
          return '<td class="' + (isBase ? "base" : "") + '">' + num(v, 1) + "</td>";
        }).join("") + "</tr>";
      }).join("") + "</tbody></table></div>";

    // WACC
    var wacc = grid([L.component, L.value, L.derivation], b.wacc, { numCols: [1], boldRows: [8, b.wacc.length - 1] });

    // Multiples
    var tr = b.trading, px = b.transaktionen;
    var trR = quartile(tr.peers.map(function (p) { return p.evEbitda; }));
    var pxR = quartile(px.deals.map(function (p) { return p.evEbitda; }));
    var compT = grid([L.company, "EV / EBITDA"], tr.peers.map(function (p) { return [p.name, num(p.evEbitda, 1) + "x"]; }), { numCols: [1] });
    var pxT = grid([L.transaction, L.year, "EV / EBITDA"], px.deals.map(function (p) { return [p.name, String(p.jahr), num(p.evEbitda, 1) + "x"]; }), { numCols: [1, 2] });

    var ff = football([
      { label: L.ffDcf, lo: Math.min.apply(null, all), hi: Math.max.apply(null, all) },
      { label: L.ffComps, lo: trR[0] * b.ebitda2025 - b.nettoverschuldung, hi: trR[1] * b.ebitda2025 - b.nettoverschuldung },
      { label: L.ffPx, lo: pxR[0] * b.ebitda2024 - b.nettoverschuldung, hi: pxR[1] * b.ebitda2024 - b.nettoverschuldung }
    ], b.dealEquityValue);

    // Returns
    var r = b.returns;
    var ret = '<div class="stack"><div class="panel min0">' + grid([L.item, L.value, L.assumption], r.zeilen, { numCols: [1], boldRows: [r.zeilen.length - 1] }) + "</div>" +
      '<div class="panel min0">' + grid([L.scenario, "IRR", "MOIC"], r.szenarien.map(function (s) { return [s.name, s.irr, s.moic]; }), { numCols: [1, 2], boldRows: [1] }) +
      '<ul class="list small">' + r.szenarien.map(function (s) { return "<li><b>" + t(s.name) + ":</b> " + t(s.annahme) + "</li>"; }).join("") + "</ul>" +
      '<p class="note">' + t(r.kommentar) + "</p></div></div>";

    return '<h3 class="h-sub">' + L.infoTitle + "</h3>" + info +
      '<h3 class="h-sub">' + L.implied + "</h3>" + impl +
      '<h3 class="h-sub">' + L.bridgeTitle + "</h3>" + bridge +
      '<h3 class="h-sub">' + L.ffTitle + '</h3><div class="panel">' + ff + "</div>" +
      '<h3 class="h-sub">Discounted Cash Flow</h3><div class="cols"><div class="panel min0">' + dcfT + '<p class="note">' + t(c.kommentar) + "</p></div>" +
      '<div class="panel">' + dcfBridge + "</div></div>" +
      '<h3 class="h-sub">' + L.sensTitle + '</h3><div class="panel">' + sens + "</div>" +
      '<h3 class="h-sub">' + L.waccTitle + '</h3><div class="panel">' + wacc + "</div>" +
      '<div class="cols mt"><div class="panel min0"><h3>Trading Comparables</h3>' + compT + '<p class="note">' + t(tr.kommentar) + "</p></div>" +
      '<div class="panel min0"><h3>Precedent Transactions</h3>' + pxT + '<p class="note">' + t(px.kommentar) + "</p></div></div>" +
      '<h3 class="h-sub">' + L.retTitle + "</h3>" + ret +
      '<div class="panel dl"><div><h3>' + L.dlTitle + '</h3><p class="note">' + L.dlText + "</p></div>" +
      modellLink("btn-dl", L.dlBtn) + "</div>" +
      quelle(b.quelle);
  }

  function football(rows, deal) {
    var vals = [deal]; rows.forEach(function (r) { vals.push(r.lo, r.hi); });
    var min = Math.floor(Math.min.apply(null, vals) / 2) * 2, max = Math.ceil(Math.max.apply(null, vals) / 2) * 2;
    if (max - min < 4) max = min + 4;
    var W = 760, Lw = 250, R = 24, rowH = 46, top = 16, H = top + rows.length * rowH + 40;
    function x(v) { return Lw + (v - min) / (max - min) * (W - Lw - R); }
    var s = '<div class="tbl-wrap"><svg class="ff" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Football Field">';
    for (var v = min; v <= max; v += 2) {
      s += '<line class="ff-grid" x1="' + x(v) + '" x2="' + x(v) + '" y1="' + top + '" y2="' + (H - 30) + '"/>' +
        '<text class="ff-tick" x="' + x(v) + '" y="' + (H - 12) + '" text-anchor="middle">' + v + "</text>";
    }
    rows.forEach(function (r, i) {
      var y = top + i * rowH + 8;
      s += '<text class="ff-lab" x="0" y="' + (y + 19) + '">' + esc(r.label) + "</text>" +
        '<rect class="ff-bar" x="' + x(r.lo) + '" y="' + y + '" width="' + Math.max(2, x(r.hi) - x(r.lo)) + '" height="28" rx="2"/>' +
        '<text class="ff-val" x="' + (x(r.lo) - 6) + '" y="' + (y + 19) + '" text-anchor="end">' + num(r.lo, 1) + "</text>" +
        '<text class="ff-val" x="' + (x(r.hi) + 6) + '" y="' + (y + 19) + '">' + num(r.hi, 1) + "</text>";
    });
    s += '<line class="ff-deal" x1="' + x(deal) + '" x2="' + x(deal) + '" y1="' + (top - 6) + '" y2="' + (H - 30) + '"/>' +
      '<text class="ff-dl" x="' + (x(deal) + 6) + '" y="' + (top + 2) + '">Deal: ' + num(deal, 2) + "</text></svg></div>" +
      '<p class="note">' + L.ffNote + "</p>";
    return s;
  }

  function rStruktur() {
    var s = D.struktur;
    function su(list, title) {
      var sum = list.reduce(function (a, b) { return a + b.betrag; }, 0);
      return '<div class="panel min0"><h3>' + title + '</h3><div class="tbl-wrap"><table class="num"><tbody>' +
        list.map(function (l) { return "<tr><td>" + t(l.posten) + "</td><td>" + mrd(l.betrag, 3) + "</td></tr>"; }).join("") +
        '<tr class="sum"><td>' + L.total + "</td><td>" + mrd(sum, 3) + "</td></tr></tbody></table></div></div>";
    }
    var own = '<div class="own">' + s.eigentum.map(function (e, i) {
      return '<div class="own-seg s' + i + '" style="flex:' + e.anteil + '"><span>' + t(e.name) + " " + e.anteil + L.pctSp + "</span></div>";
    }).join("") + "</div>";
    return '<div class="cols">' + su(s.mittelverwendung, L.uses) + su(s.mittelherkunft, L.sources) + "</div>" +
      '<h3 class="h-sub">' + L.ownership + '</h3><div class="panel">' + own + "</div>" +
      '<h3 class="h-sub">' + L.mechanics + '</h3><ul class="list">' + s.punkte.map(function (p) { return "<li>" + t(p) + "</li>"; }).join("") + "</ul>" +
      quelle(s.quelle);
  }

  function rRisiken() {
    return '<div class="grid-2">' + D.risiken.map(function (r) {
      return '<div class="panel risk"><div class="risk-h"><h4>' + t(r.titel) + '</h4><span class="pill ' + esc(r.stufe) + '">' + esc(L.risk[r.stufe] || r.stufe) + "</span></div><p>" + t(r.text) + "</p></div>";
    }).join("") + "</div>" + quelle(D.risikenQuelle);
  }

  function rFazit() {
    var f = D.fazit;
    return '<p class="prose big">' + t(f.kernaussage) + '</p><ul class="list">' + f.punkte.map(function (p) { return "<li>" + t(p) + "</li>"; }).join("") +
      '</ul><div class="panel lookback"><h3>' + L.lookback + ' <span class="stamp post">ex post</span></h3><p>' + t(f.rueckblick) + "</p></div>" +
      '<div class="panel"><h3>' + L.learnings + "</h3><p>" + t(f.learnings) + "</p></div>";
  }

  /* ---------- Sprache ---------- */
  function getLang() {
    var m = /[?&]lang=(de|en)/.exec(location.search);
    if (m) return m[1];
    try { var s = localStorage.getItem("venezia-lang"); if (s === "de" || s === "en") return s; } catch (e) {}
    return "de";
  }
  function setLang(l) {
    lang = l; D = l === "en" ? window.DEAL_EN : window.DEAL_DE; L = UI[l];
    document.documentElement.lang = l;
    try { localStorage.setItem("venezia-lang", l); } catch (e) {}
    document.getElementById("brand").textContent = D.meta.projektname;
    document.getElementById("foot").innerHTML = t(D.meta.autor) + " · " + t(D.meta.anlass) + " · " + L.footer;
    document.getElementById("lang").innerHTML = ["de", "en"].map(function (k) {
      return '<button type="button" data-l="' + k + '"' + (k === l ? ' aria-pressed="true"' : ' aria-pressed="false"') + ">" + k.toUpperCase() + "</button>";
    }).join("");
    show(true);
  }
  document.getElementById("lang").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-l]");
    if (b && b.getAttribute("data-l") !== lang) setLang(b.getAttribute("data-l"));
  });

  /* ---------- Router ---------- */
  function nav(active, SEC) {
    document.getElementById("nav").innerHTML = SEC.map(function (s) {
      return '<a href="#' + s.id + '"' + (s.id === active ? ' aria-current="page"' : "") + ">" + esc(s.titel) + "</a>";
    }).join("");
  }
  function show(keepScroll) {
    var SEC = sections();
    var id = (location.hash || "").slice(1);
    var idx = -1;
    SEC.forEach(function (s, i) { if (s.id === id) idx = i; });
    nav(idx >= 0 ? id : "", SEC);
    if (idx < 0) { app.innerHTML = rLanding(); document.title = D.meta.projektname; }
    else {
      var s = SEC[idx], prev = SEC[idx - 1], next = SEC[idx + 1];
      app.innerHTML = '<div class="wrap page"><p class="crumb"><a href="#start">Start</a> / ' + L.crumbOf(idx + 1, SEC.length) + "</p>" +
        "<h1 class=\"h-page\">" + esc(s.titel) + "</h1>" + s.render() +
        '<nav class="pager">' + (prev ? '<a href="#' + prev.id + '">← ' + esc(prev.titel) + "</a>" : '<a href="#start">← Start</a>') +
        (next ? '<a href="#' + next.id + '">' + esc(next.titel) + " →</a>" : '<a href="#start">' + L.home + " →</a>") + "</nav></div>";
      document.title = s.titel + " · " + D.meta.projektname;
    }
    if (keepScroll !== true) window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", function () { show(); });
  setLang(getLang());
})();
</script>
</body>
</html>
